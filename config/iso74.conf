# =============================================================================
#  iso74 — premium config
#  supermini nRF52840 (built as nice_nano) · 6x15 handwired matrix
#  matrix transform + keymap live in config/boards/shields/iso74/ (untouched)
# =============================================================================

# --- hardware note -----------------------------------------------------------
# NFC pins (P0.09 / P0.10) for col11 / col10: freeing them moved from Kconfig to
# devicetree in Zephyr 4.1. See the &uicr block in
# config/boards/shields/iso74/iso74.overlay (CONFIG_NFCT_PINS_AS_GPIOS was removed).

# --- radio / bluetooth -------------------------------------------------------
# Crank the nRF52840 radio to its max +8 dBm transmit power. Stronger, more
# robust link = fewer supervision-timeout drops, better range through desks/bodies.
# This is the single most relevant knob for the disconnect issue we're chasing.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keep the BLE identity/bonds stable across firmware flashes.
CONFIG_ZMK_BLE=y

# --- HID quality of life -----------------------------------------------------
# Full N-key rollover so every key registers no matter how many you mash.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Expose the full consumer/media usage range (all the media + system keys work).
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# --- battery -----------------------------------------------------------------
# Report battery % over BLE so the OS shows the level.
# NOTE: this assumes the supermini replicates the nice!nano battery divider
# (P0.04 / AIN2). If the reported % looks bogus, the clone's divider differs and
# it needs a custom `zmk,battery` node in the overlay — tell me and I'll wire it.
CONFIG_ZMK_BATTERY_REPORTING=y

# --- power / deep sleep ------------------------------------------------------
# Deep sleep massively extends battery life, BUT it intentionally disconnects
# after the idle timeout — which looks just like the drop bug we're hunting.
# Leave these OFF until the disconnect gremlin is confirmed dead, THEN flip on.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT_MS=1800000   # deep sleep after 30 min idle

# --- optional: pointing / mouse keys ----------------------------------------
# Your fn2 layer is a blank canvas — enable this and you can drop mouse-move /
# click / scroll behaviours onto it. (main-branch name; safe to leave commented.)
# CONFIG_ZMK_POINTING=y

# --- debounce (handwired boards can chatter — tune ONLY if you see doubles) --
# Defaults are 5ms press / 5ms release. Lower = snappier but riskier on hand
# solder joints. Uncomment + tweak only if keys feel laggy AND you've confirmed
# no chatter.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=4
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=6

# --- bring-up aid: stream logs over USB serial -------------------------------
# Uncomment + reflash to watch the keeb's own side of a disconnect on /dev/ttyACM0
# (sudo screen /dev/ttyACM0 115200). Handy right now for the drop diagnosis;
# turn back off for daily use.
# CONFIG_ZMK_USB_LOGGING=y
